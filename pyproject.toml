[project]
name = "ha-daikin-india"
version = "0.1.1"
description = "Home Assistant integration for Daikin India air conditioners (DSIOT protocol)"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "PLW0603", "RUF003", "RUF012", "SIM102", "SIM108", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

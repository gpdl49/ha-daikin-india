name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Local, Cloud (GO DAIKIN app account), Both]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AC model and adapter firmware
      description: From the device page in Home Assistant or the GO DAIKIN app.
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
      placeholder: "HA 2026.10.1, daikin_india 0.2.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable with `logger: logs: custom_components.daikin_india: debug`, reproduce, and paste the relevant lines.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Device page → ⋮ → Download diagnostics, then drag the file here. Personal identifiers are redacted.

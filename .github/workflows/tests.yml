name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install "pytest-homeassistant-custom-component==0.13.316" ruff
      - name: Lint
        run: |
          uv run --no-project ruff check custom_components tests
          uv run --no-project ruff format --check custom_components tests
      - name: Test
        run: uv run --no-project pytest
